# Gate configuration
#
# docs/GATE.md が要求する検証を、このプロジェクトで実際に実行するコマンドとして宣言する。
# scripts/gate.sh はこのファイルだけを参照する。検証コマンドの定義箇所はここ一箇所とする。
#
# 空文字のままの項目は「未設定」として扱われる。
#   scripts/gate.sh           未設定は SKIP（Gate は失敗しない）
#   scripts/gate.sh --strict  未設定は FAIL（TestFlight前の最終Gateで使う）
#
# 技術構成: React Native + Expo (TypeScript) / Supabase。docs/STACK.md を参照。
# Workerが単独でこのファイルを変更してはいけない（CLAUDE.md 第9章 / 第14章）。

# 型チェック
GATE_TYPECHECK="npm run --silent typecheck"

# Lint
GATE_LINT="npm run --silent lint"

# 自動テスト（unit / integration）
GATE_TEST="npm run --silent test"

# ビルド
GATE_BUILD="npm run --silent export"

# migration / schema の整合性
# 空のデータベースへ全migrationを適用できることを確認する。
# DATABASE_URL があればそれを使い、無ければ使い捨てクラスタを起動する。
GATE_MIGRATION="./scripts/check-migrations.sh"

# dependency の整合性（lockfileの同期など）
GATE_DEPENDENCY="npm ci --dry-run --no-audit --no-fund"

# architecture制約の検証（依存方向、レイヤ境界など）
GATE_ARCHITECTURE="./scripts/check-architecture.sh"

# 重複実装の検出（CLAUDE.md 第17章 同じ機能の重複実装）
GATE_DUPLICATION="npm run --silent duplication"

# 未使用コード・未使用exportの検出（増築の回収）
GATE_UNUSED="npm run --silent unused"
