# Gate configuration
#
# docs/GATE.md が要求する検証を、このプロジェクトで実際に実行するコマンドとして宣言する。
# scripts/gate.sh はこのファイルだけを参照する。検証コマンドの定義箇所はここ一箇所とする。
#
# 空文字のままの項目は「未設定」として扱われる。
#   scripts/gate.sh           未設定は SKIP（Gate は失敗しない）
#   scripts/gate.sh --strict  未設定は FAIL（TestFlight前の最終Gateで使う）
#
# 技術構成が確定したら、Leaderがこの値を埋める。
# Workerが単独でこのファイルを変更してはいけない（CLAUDE.md 第9章 / 第14章）。

# 型チェック
GATE_TYPECHECK=""

# Lint
GATE_LINT=""

# 自動テスト（unit / integration）
GATE_TEST=""

# ビルド
GATE_BUILD=""

# migration / schema の整合性
GATE_MIGRATION=""

# dependency の整合性（lockfileの同期など）
GATE_DEPENDENCY=""

# architecture制約の検証（依存方向、レイヤ境界など）
GATE_ARCHITECTURE=""
